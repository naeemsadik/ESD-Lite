# ESD Memory: visual theme.
# One accent (cobalt #2A78D6) is reserved for "our method"; the current method stays neutral.
# Type: Atkinson Hyperlegible, chosen for legibility on a projector. Fonts are served from static/fonts (OFL).

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# Hide the developer toolbar items (Deploy, rerun, settings) during demos.
toolbarMode = "minimal"

[theme]
font = "Atkinson Hyperlegible Next, system-ui, sans-serif"
headingFont = "Atkinson Hyperlegible Next, system-ui, sans-serif"
codeFont = "Atkinson Hyperlegible Mono, ui-monospace, monospace"
headingFontWeights = [700, 700, 650, 650, 600, 600]
baseFontSize = 16
baseRadius = "0.625rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "app/static/fonts/AtkinsonHyperlegibleNext.woff2"
weight = "200 800"
style = "normal"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "app/static/fonts/AtkinsonHyperlegibleNext-Italic.woff2"
weight = "200 800"
style = "italic"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Mono"
url = "app/static/fonts/AtkinsonHyperlegibleMono.woff2"
weight = "200 800"
style = "normal"

[theme.light]
primaryColor = "#2A78D6"
backgroundColor = "#F3F5F8"
secondaryBackgroundColor = "#E8ECF2"
textColor = "#172033"
borderColor = "#D9DFE8"
linkColor = "#1D5DB0"
codeTextColor = "#172033"
codeBackgroundColor = "#EDF0F5"
redColor = "#C8372D"
greenColor = "#1E7B45"
blueColor = "#2A78D6"
dataframeHeaderBackgroundColor = "#EDF0F5"

[theme.light.sidebar]
backgroundColor = "#EAEEF3"

[theme.dark]
primaryColor = "#3987E5"
backgroundColor = "#11151C"
secondaryBackgroundColor = "#1A1F29"
textColor = "#E6E9EF"
borderColor = "#2A313D"
linkColor = "#7DB0F0"
codeTextColor = "#E6E9EF"
codeBackgroundColor = "#1A1F29"
redColor = "#E5645A"
greenColor = "#3FB07A"
blueColor = "#3987E5"
dataframeHeaderBackgroundColor = "#1A1F29"

[theme.dark.sidebar]
backgroundColor = "#151A22"
